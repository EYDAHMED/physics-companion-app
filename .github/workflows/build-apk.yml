name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies and build dist
        working-directory: physics-companion
        run: |
          npm install
          npm run build

      - name: Setup Capacitor Android
        working-directory: physics-companion
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Physics" "com.physics.companion" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: physics-companion/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: physics-companion-apk
          path: physics-companion/android/app/build/outputs/apk/debug/app-debug.apk
